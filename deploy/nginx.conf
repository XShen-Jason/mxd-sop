server {
    listen 80;
    listen [::]:80;
    server_name ops.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.example.internal;

    # Replace with certificates issued by your internal CA or ACME.
    ssl_certificate /etc/letsencrypt/live/ops.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.internal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/ops-desk/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:26902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:26902;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
