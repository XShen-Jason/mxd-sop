# Server context for the SOP and auto HTTPS virtual hosts only.
# SOP admits a burst of ten; the backend enforces its exact window and lockout.
# Auto retains its independent existing burst and sustained rate.
limit_req zone=mxd_sop_login_ip burst=9 nodelay;
limit_req zone=mxd_login_ip burst=5 nodelay;
limit_req zone=mxd_login_host burst=10 nodelay;
limit_req_status 429;
limit_req_log_level warn;
access_log /var/log/nginx/access.log combined;
access_log /var/log/nginx/mxd-security.log mxd_security;
