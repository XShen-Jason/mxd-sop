# HTTP context: install as /etc/nginx/conf.d/mxd-login-guard.conf.
# SOP aliases share a bucket separate from auto's matching login protection.
# Ordinary APIs have empty keys and consume no login budget. Server snippets
# belong only in MXD hosts; the SOP backend owns the strict rolling-window rule.
map $uri $mxd_sop_login_ip {
    default "";
    /api/v1/auth/login "$server_name|$remote_addr";
    /api/v1/login "$server_name|$remote_addr";
}
map $uri $mxd_login_ip {
    default "";
    /api/v1/operator/login "$server_name|$remote_addr";
}
map "$mxd_sop_login_ip$mxd_login_ip" $mxd_login_host {
    "" "";
    default $server_name;
}
# 2/minute is the sustained equivalent of SOP's 10 requests per five minutes;
# burst=9 admits ten immediately. This coarse filter is not the exact window.
limit_req_zone $mxd_sop_login_ip zone=mxd_sop_login_ip:10m rate=2r/m;
limit_req_zone $mxd_login_ip zone=mxd_login_ip:10m rate=2r/m;
limit_req_zone $mxd_login_host zone=mxd_login_host:1m rate=2r/s;

# Evaluate the restored visitor, not the Cloudflare connection. A mapped IPv4
# peer is IPv4; every real IPv6 visitor is denied in the two included servers.
map $remote_addr $mxd_ipv6_denied {
    default 0;
    ~^::ffff:[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ 0;
    ~: 1;
}
# Cloudflare's Pseudo IPv4 overwrite mode preserves the original IPv6 in this
# header. It can only add a denial, never grant access or select a ban identity;
# a forged header from a direct client can therefore only deny its own request.
map $http_cf_connecting_ipv6 $mxd_original_ipv6 {
    default 0;
    ~: 1;
}

# No query strings, cookies, passwords, tokens, or bodies enter this log.
# peer_ip preserves the connecting proxy while client_ip is the verified source.
log_format mxd_security escape=json '{"time":"$time_iso8601",'
    '"host":"$server_name","client_ip":"$remote_addr",'
    '"peer_ip":"$realip_remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"limit":"$limit_req_status",'
    '"seconds":$request_time,"request_id":"$request_id"}';
